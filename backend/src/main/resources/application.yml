server:
  port: 8080

spring:
  application:
    name: binance-compound-pro
  
  datasource:
    url: jdbc:mysql://${DB_HOST:mysql}:3306/binance_compound?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=utf-8
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:rootpassword}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000
  
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
    open-in-view: false
  
  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: 6379
      timeout: 5000ms

logging:
  level:
    root: INFO
    com.binance.compound: DEBUG
    org.hibernate.SQL: WARN

binance:
  base-url: https://api.binance.com
  websocket-url: wss://stream.binance.com:9443/ws
  api-key: ${BINANCE_API_KEY:}
  api-secret: ${BINANCE_API_SECRET:}
  timeout-seconds: 10
  proxy-url: ${BINANCE_PROXY:}

funding-rate:
  enabled: true
  scan-interval-ms: 300000
  symbols: BTCUSDT,ETHUSDT,SOLUSDT,BNBUSDT,DOGEUSDT
  main-threshold-level1: -0.0005
  main-threshold-level2: -0.001
  alt-threshold-level1: -0.001
  alt-threshold-level2: -0.002
  cooldown-hours: 2

simulation:
  default-take-profit-pct: 0.03
  default-quote-reserve: 10
  default-max-orders-per-tick: 5
  auto-tick-enabled: true
  auto-tick-interval-ms: 30000
