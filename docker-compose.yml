services:
  mysql:
    image: mysql:8.0
    container_name: binance-compound-mysql
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: binance_compound_v2
    ports:
      - "13306:3306"
    volumes:
      - ./data/mysql-v2:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-prootpassword"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - compound-network

  redis:
    image: redis:7-alpine
    container_name: binance-compound-redis
    command: redis-server --maxclients 1000 --save 60 1 --loglevel warning
    ports:
      - "16379:6379"
    volumes:
      - ./data/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - compound-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: binance-compound-backend
    dns:
      - 8.8.8.8
      - 1.1.1.1
    env_file:
      - ./backend/.env.example
    environment:
      DB_HOST: mysql
      DB_USER: root
      DB_PASSWORD: rootpassword
      DB_NAME: binance_compound_v2
      LEGACY_DB_NAME: binance_compound
      REDIS_HOST: redis
      DJANGO_SETTINGS_MODULE: binance_bot.settings
      BINANCE_PROXY_URL: ${BINANCE_PROXY:-http://192.168.4.51:7897}
    command: daphne -b 0.0.0.0 -p 8080 binance_bot.asgi:application
    ports:
      - "18080:8080"
    volumes:
      - ./backend:/app
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - compound-network
    restart: unless-stopped

  celery-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    dns:
      - 8.8.8.8
      - 1.1.1.1
    env_file:
      - ./backend/.env.example
    environment:
      DB_HOST: mysql
      DB_USER: root
      DB_PASSWORD: rootpassword
      DB_NAME: binance_compound_v2
      LEGACY_DB_NAME: binance_compound
      REDIS_HOST: redis
      DJANGO_SETTINGS_MODULE: binance_bot.settings
    command: celery -A binance_bot worker -l info -c 4
    volumes:
      - ./backend:/app
    depends_on:
      - mysql
      - redis
      - backend
    networks:
      - compound-network
    restart: unless-stopped
    deploy:
      replicas: 2

  celery-beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: binance-compound-celery-beat
    dns:
      - 8.8.8.8
      - 1.1.1.1
    env_file:
      - ./backend/.env.example
    environment:
      DB_HOST: mysql
      DB_USER: root
      DB_PASSWORD: rootpassword
      DB_NAME: binance_compound_v2
      LEGACY_DB_NAME: binance_compound
      REDIS_HOST: redis
      DJANGO_SETTINGS_MODULE: binance_bot.settings
    command: celery -A binance_bot beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    volumes:
      - ./backend:/app
    depends_on:
      - mysql
      - redis
    networks:
      - compound-network
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: binance-compound-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - compound-network
    restart: unless-stopped

networks:
  compound-network:
    driver: bridge
