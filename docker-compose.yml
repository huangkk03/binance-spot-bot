version: '3.8'

services:
  mysql:
    image: mysql:5.6
    container_name: binance-compound-mysql
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: binance_compound
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./backend/src/main/resources/DB_SCHEMA.sql:/docker-entrypoint-initdb.d/DB_SCHEMA.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - compound-network

  redis:
    image: redis:7-alpine
    container_name: binance-compound-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - compound-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: binance-compound-backend
    environment:
      DB_HOST: mysql
      DB_USER: root
      DB_PASSWORD: rootpassword
      REDIS_HOST: redis
      SPRING_PROFILES_ACTIVE: docker
      BINANCE_PROXY: ${BINANCE_PROXY:-}
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - compound-network
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: binance-compound-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - compound-network
    restart: unless-stopped

volumes:
  mysql_data:

networks:
  compound-network:
    driver: bridge
